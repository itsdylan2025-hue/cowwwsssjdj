name: Build Clock APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create app files
        run: |
          mkdir -p clock/app
          cat > clock/app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.glassclock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.glassclock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE
          mkdir -p clock/app/src/main
          cat > clock/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Glass Clock"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".GlassTextWidget"
                      android:exported="true"
                      android:label="Glass Clock (digits only)">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_text_info" />
                  </receiver>

                  <receiver
                      android:name=".GlassCardWidget"
                      android:exported="true"
                      android:label="Glass Clock (glass card)">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_card_info" />
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p clock/app/src/main/java/com/example/glassclock
          cat > clock/app/src/main/java/com/example/glassclock/GlassWidgets.kt <<'EOF_FILE'
          package com.example.glassclock

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.provider.AlarmClock
          import android.widget.RemoteViews

          abstract class GlassBase(private val layoutId: Int) : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  for (id in ids) {
                      val views = RemoteViews(context.packageName, layoutId)
                      val intent = Intent(AlarmClock.ACTION_SHOW_ALARMS)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      val pi = PendingIntent.getActivity(
                          context, 0, intent,
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      views.setOnClickPendingIntent(R.id.root, pi)
                      manager.updateAppWidget(id, views)
                  }
              }
          }

          class GlassTextWidget : GlassBase(R.layout.widget_text)

          class GlassCardWidget : GlassBase(R.layout.widget_card)
          EOF_FILE
          mkdir -p clock/app/src/main/java/com/example/glassclock
          cat > clock/app/src/main/java/com/example/glassclock/MainActivity.kt <<'EOF_FILE'
          package com.example.glassclock

          import android.app.Activity
          import android.os.Bundle
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val pad = (24 * d).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  root.addView(TextView(this).apply {
                      text = "Glass Clock"
                      textSize = 26f
                  })
                  root.addView(TextView(this).apply {
                      text = "This app has no settings. It adds two clock widgets:\n\n" +
                              "- Glass Clock (digits only)\n" +
                              "- Glass Clock (glass card)\n\n" +
                              "Home screen: long-press the home screen, tap Widgets, find Glass Clock.\n\n" +
                              "Lock screen: Good Lock > LockStar > add App widgets, then pick Glass Clock."
                      setPadding(0, (16 * d).toInt(), 0, 0)
                  })
                  setContentView(root)
              }
          }
          EOF_FILE
          mkdir -p clock/app/src/main/res/drawable
          cat > clock/app/src/main/res/drawable/glass_card.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:startColor="#52FFFFFF"
                  android:endColor="#14FFFFFF" />
              <stroke
                  android:width="1dp"
                  android:color="#73FFFFFF" />
              <corners android:radius="34dp" />
          </shape>
          EOF_FILE
          mkdir -p clock/app/src/main/res/layout
          cat > clock/app/src/main/res/layout/widget_card.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/glass_card"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="12dp">

              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:format12Hour="EEEE d MMMM"
                  android:format24Hour="EEEE d MMMM"
                  android:fontFamily="sans-serif-medium"
                  android:shadowColor="#40000000"
                  android:shadowDx="0"
                  android:shadowDy="2"
                  android:shadowRadius="8"
                  android:textColor="#E6FFFFFF"
                  android:textSize="18sp" />

              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:format12Hour="h"
                  android:format24Hour="HH"
                  android:fontFamily="sans-serif-black"
                  android:includeFontPadding="false"
                  android:shadowColor="#59000000"
                  android:shadowDx="0"
                  android:shadowDy="6"
                  android:shadowRadius="16"
                  android:textColor="#B3FFFFFF"
                  android:textSize="92sp" />

              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="-14dp"
                  android:format12Hour="mm"
                  android:format24Hour="mm"
                  android:fontFamily="sans-serif-black"
                  android:includeFontPadding="false"
                  android:shadowColor="#59000000"
                  android:shadowDx="0"
                  android:shadowDy="6"
                  android:shadowRadius="16"
                  android:textColor="#B3FFFFFF"
                  android:textSize="92sp" />
          </LinearLayout>
          EOF_FILE
          mkdir -p clock/app/src/main/res/layout
          cat > clock/app/src/main/res/layout/widget_text.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="8dp">

              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:format12Hour="EEEE d MMMM"
                  android:format24Hour="EEEE d MMMM"
                  android:fontFamily="sans-serif-medium"
                  android:shadowColor="#40000000"
                  android:shadowDx="0"
                  android:shadowDy="2"
                  android:shadowRadius="8"
                  android:textColor="#D9FFFFFF"
                  android:textSize="18sp" />

              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:format12Hour="h"
                  android:format24Hour="HH"
                  android:fontFamily="sans-serif-black"
                  android:includeFontPadding="false"
                  android:shadowColor="#59000000"
                  android:shadowDx="0"
                  android:shadowDy="6"
                  android:shadowRadius="16"
                  android:textColor="#8CFFFFFF"
                  android:textSize="92sp" />

              <TextClock
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="-14dp"
                  android:format12Hour="mm"
                  android:format24Hour="mm"
                  android:fontFamily="sans-serif-black"
                  android:includeFontPadding="false"
                  android:shadowColor="#59000000"
                  android:shadowDx="0"
                  android:shadowDy="6"
                  android:shadowRadius="16"
                  android:textColor="#8CFFFFFF"
                  android:textSize="92sp" />
          </LinearLayout>
          EOF_FILE
          mkdir -p clock/app/src/main/res/xml
          cat > clock/app/src/main/res/xml/widget_card_info.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="230dp"
              android:targetCellWidth="3"
              android:targetCellHeight="3"
              android:initialLayout="@layout/widget_card"
              android:previewLayout="@layout/widget_card"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen|keyguard" />
          EOF_FILE
          mkdir -p clock/app/src/main/res/xml
          cat > clock/app/src/main/res/xml/widget_text_info.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="230dp"
              android:targetCellWidth="3"
              android:targetCellHeight="3"
              android:initialLayout="@layout/widget_text"
              android:previewLayout="@layout/widget_text"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen|keyguard" />
          EOF_FILE
          mkdir -p clock
          cat > clock/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p clock
          cat > clock/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p clock
          cat > clock/settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GlassClock"
          include(":app")
          EOF_FILE
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: clock
      - uses: actions/upload-artifact@v4
        with:
          name: GlassClock-apk
          path: clock/app/build/outputs/apk/debug/app-debug.apk
