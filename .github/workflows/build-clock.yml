      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: clock
      - uses: actions/upload-artifact@v4
        with:
          name: GlassClock-apk
          path: clock/app/build/outputs/apk/debug/app-debug.apk
